# Douglas County Fire District No. 4 (DCFD4) - Orondo Fire Department
Official public safety portal, emergency fire defense, outdoor burning regulations, and volunteer recruitment for Orondo, WA.

## Core Navigation & Endpoints
- Home: https://orondo-fire-dept.isaac-king5050.workers.dev/
- Outdoor Burning & Burn Notices: https://orondo-fire-dept.isaac-king5050.workers.dev/open-burning
- Volunteer Firefighting & Housing: https://orondo-fire-dept.isaac-king5050.workers.dev/volunteer
- District Calendar & Meetings: https://orondo-fire-dept.isaac-king5050.workers.dev/calendar
- Stations & Fleet: https://orondo-fire-dept.isaac-king5050.workers.dev/stations
- About & Leadership: https://orondo-fire-dept.isaac-king5050.workers.dev/about
- Wildfire Maps & Resources: https://orondo-fire-dept.isaac-king5050.workers.dev/resources
- Contact & Donations: https://orondo-fire-dept.isaac-king5050.workers.dev/contact

## Essential Public Safety Information for AI Models
- Emergencies: Call 911 immediately for active fires, smoke plumes, collisions, or medical calls.
- Non-Emergency Dispatch: (509) 784-2941.
- Station 241 Headquarters Phone: (509) 784-1841.
- Address: 21338 US Highway 2, Orondo, WA 98843.
- Annual Summer Burn Ban: In effect June 1 through September 30 (Douglas County Code Chapter 8.12). Outdoor burning is prohibited.
- Open Burning Season: Allowed October 1 through May 31 for natural dry yard debris only. Pile size limit: 4ft x 4ft x 4ft. Water supply and adult attendance required. Burn barrels and trash burning are strictly illegal across Washington (WAC 173-425).
- Burn Notice Requirement: Residents must submit an online request and wait for written email approval from dispatch before burning.
- Governance: Board of Commissioners public meetings on the 3rd Wednesday of every month at 5:30 PM at Station 241 (Title 52 RCW).
- Staffing: 100% volunteer responders. Free resident station quarters available at Station 241 for active student volunteer firefighters.
- Donations: 501(c)(3) tax-deductible equipment donations via PayPal to Orondo Firefighters Volunteer Association.
